name: FileBe CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npx expo install --check
      - run: npm run verify
      - run: npm run release:check
      - run: npm run export:android
      - run: npm run export:ios
